            // Snakes and ladders configuration with clear labels
            const snakesAndLadders = {
                // Ladders (start: end)
                3: {end: 12, label: "3 ← 12"},
                7: {end: 29, label: "7 ← 29"},
                15: {end: 37, label: "15 ← 37"},
                22: {end: 42, label: "22 ← 42"},
                28: {end: 53, label: "28 ← 53"},
                41: {end: 79, label: "41 ← 79"},
                // Snakes (start: end)
                17: {end: 4, label: "17 → 4"},
                31: {end: 14, label: "31 → 14"},
                38: {end: 20, label: "38 → 20"},
                54: {end: 34, label: "54 → 34"},
                62: {end: 43, label: "62 → 43"},
                64: {end: 60, label: "64 → 60"},
                70: {end: 49, label: "70 → 49"},
                76: {end: 63, label: "76 → 63"},
                88: {end: 67, label: "88 → 67"},
                92: {end: 72, label: "92 → 72"},
                95: {end: 75, label: "95 → 75"},
                99: {end: 80, label: "99 → 80"}
            };
            
            // Initialize the board
            function initializeBoard() {
                board.innerHTML = '';
                
                // Create cells in reverse order for snake and ladder game
                for (let row = 9; row >= 0; row--) {
                    for (let col = 0; col < 10; col++) {
                        const cellNumber = (row % 2 === 0) ? (row * 10 + col + 1) : (row * 10 + (10 - col));
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.number = cellNumber;
                        
                        const cellNumberSpan = document.createElement('span');
                        cellNumberSpan.className = 'cell-number';
                        cellNumberSpan.textContent = cellNumber;
                        cell.appendChild(cellNumberSpan);
                        
                        board.appendChild(cell);
                    }
                }
                
                // Add snakes and ladders
                addSnakesAndLadders();
                
                // Initialize players
                initializePlayers();
            }
            
            // Add snakes and ladders to the board with labels
            function addSnakesAndLadders() {
                Object.keys(snakesAndLadders).forEach(start => {
                    const {end, label} = snakesAndLadders[start];
                    const startCell = document.querySelector(`.cell[data-number="${start}"]`);
                    const endCell = document.querySelector(`.cell[data-number="${end}"]`);
                    
                    if (!startCell || !endCell) return;
                    
                    const startRect = startCell.getBoundingClientRect();
                    const endRect = endCell.getBoundingClientRect();
                    const boardRect = board.getBoundingClientRect();
                    
                    const startX = startRect.left + startRect.width / 2 - boardRect.left;
                    const startY = startRect.top + startRect.height / 2 - boardRect.top;
                    const endX = endRect.left + endRect.width / 2 - boardRect.left;
                    const endY = endRect.top + endRect.height / 2 - boardRect.top;
                    
                    // Create connector (ladder or snake)
                    const connector = document.createElement('div');
                    connector.className = start < end ? 'ladder connector' : 'snake connector';
                    
                    // Calculate connector dimensions and position
                    const width = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
                    const height = start < end ? 20 : 15;
                    const angle = Math.atan2(endY - startY, endX - startX);
                    
                    connector.style.width = `${width}px`;
                    connector.style.height = `${height}px`;
                    connector.style.left = `${startX}px`;
                    connector.style.top = `${startY - height/2}px`;
                    connector.style.transformOrigin = '0 50%';
                    connector.style.transform = `rotate(${angle}rad)`;
                    
                    board.appendChild(connector);
                    
                    // Add label at the middle of the connector
                    const labelElement = document.createElement('div');
                    labelElement.className = start < end ? 'ladder-label connector-label' : 'snake-label connector-label';
                    labelElement.textContent = label;
                    
                    // Position label at the middle point
                    const midX = (startX + endX) / 2;
                    const midY = (startY + endY) / 2;
                    
                    // Adjust label position based on angle to make it readable
                    const angleDeg = angle * (180 / Math.PI);
                    let labelOffsetX = 0;
                    let labelOffsetY = 0;
                    
                    if (angleDeg > 45 && angleDeg < 135) {
                        labelOffsetX = 15;
                    } else if (angleDeg > -135 && angleDeg < -45) {
                        labelOffsetX = -15;
                    } else if (angleDeg >= -45 && angleDeg <= 45) {
                        labelOffsetY = -10;
                    } else {
                        labelOffsetY = 10;
                    }
                    
                    labelElement.style.left = `${midX - 15 + labelOffsetX}px`;
                    labelElement.style.top = `${midY - 8 + labelOffsetY}px`;
                    
                    board.appendChild(labelElement);
                });
            }
            
            // Initialize players on the board
            function initializePlayers() {
                // Remove existing players
                document.querySelectorAll('.player').forEach(el => el.remove());
                
                // Add player 1
                const player1 = document.createElement('div');
                player1.className = 'player player1';
                player1.id = 'player1';
                board.appendChild(player1);
                updatePlayerPosition(1, 1);
                
                // Add player 2
                const player2 = document.createElement('div');
                player2.className = 'player player2';
                player2.id = 'player2';
                board.appendChild(player2);
                updatePlayerPosition(2, 1);
                
                // Set current player
                setCurrentPlayer(currentPlayer);
            }
            
            // Update player position on the board
            function updatePlayerPosition(player, position) {
                const playerElement = document.getElementById(`player${player}`);
                const cell = document.querySelector(`.cell[data-number="${position}"]`);
                
                if (!cell || !playerElement) return;
                
                const cellRect = cell.getBoundingClientRect();
                const boardRect = board.getBoundingClientRect();
                
                // Position the player in the cell with offset for two players
                const offset = player === 1 ? -10 : 10;
                playerElement.style.left = `${cellRect.left - boardRect.left + cellRect.width / 2 - 12 + offset}px`;
                playerElement.style.top = `${cellRect.top - boardRect.top + cellRect.height / 2 - 12}px`;
                
                // Bring player to front
                playerElement.style.zIndex = '10';
                
                // Apply movement animation
                playerElement.classList.add('move-up');
                setTimeout(() => {
                    playerElement.classList.remove('move-up');
                }, 500);
            }
            
            // Set the current player
            function setCurrentPlayer(player) {
                currentPlayer = player;
                
                if (player === 1) {
                    player1Info.classList.add('current-player');
                    player2Info.classList.remove('current-player');
                } else {
                    player1Info.classList.remove('current-player');
                    player2Info.classList.add('current-player');
                }
            }
            
            // Roll the dice
            function rollDice() {
                if (!gameActive) return;
                
                dice.classList.add('rolling');
                dice.textContent = '...';
                
                setTimeout(() => {
                    const diceValue = Math.floor(Math.random() * 6) + 1;
                    dice.textContent = diceValue;
                    dice.classList.remove('rolling');
                    
                    // Show question modal
                    showQuestion(diceValue);
                }, 1000);
            }
            
            // Show question modal
            function showQuestion(diceValue) {
                if (!gameActive) return;
                
                const randomQuestion = questions[Math.floor(Math.random() * questions.length)];
                questionText.textContent = randomQuestion.question;
                optionsContainer.innerHTML = '';
                resultText.textContent = '';
                
                randomQuestion.options.forEach((option, index) => {
                    const optionElement = document.createElement('div');
                    optionElement.className = 'option';
                    optionElement.textContent = option;
                    optionElement.dataset.index = index;
                    
                    optionElement.addEventListener('click', () => {
                        checkAnswer(index, randomQuestion.correctAnswer, diceValue);
                    });
                    
                    optionsContainer.appendChild(optionElement);
                });
                
                questionModal.style.display = 'flex';
            }
            
            // Check the answer
            function checkAnswer(selectedIndex, correctIndex, diceValue) {
                const options = document.querySelectorAll('.option');
                
                options.forEach((option, index) => {
                    if (index === correctIndex) {
                        option.classList.add('correct');
                    } else if (index === selectedIndex && index !== correctIndex) {
                        option.classList.add('wrong');
                    }
                    
                    option.style.pointerEvents = 'none';
                });
                
                if (selectedIndex === correctIndex) {
                    resultText.textContent = 'إجابة صحيحة! يمكنك الاستمرار.';
                    setTimeout(() => {
                        questionModal.style.display = 'none';
                        movePlayer(diceValue);
                    }, 1500);
                } else {
                    resultText.textContent = 'إجابة خاطئة! سيتم تخطي دورك.';
                    setTimeout(() => {
                        questionModal.style.display = 'none';
                        switchPlayer();
                    }, 1500);
                }
            }
            
            // Move the player
            function movePlayer(steps) {
                let newPosition = playerPositions[currentPlayer - 1] + steps;
                
                // Check if player won
                if (newPosition >= 100) {
                    newPosition = 100;
                    gameActive = false;
                    winnerText.textContent = `اللاعب ${currentPlayer} فاز! المسيح قام!`;
                    winnerText.style.display = 'block';
                }
                
                // Check for snake or ladder
                if (snakesAndLadders[newPosition]) {
                    const destination = snakesAndLadders[newPosition].end;
                    const isLadder = destination > newPosition;
                    
                    setTimeout(() => {
                        newPosition = destination;
                        playerPositions[currentPlayer - 1] = newPosition;
                        updatePlayerPosition(currentPlayer, newPosition);
                        
                        if (newPosition === 100) {
                            gameActive = false;
                            winnerText.textContent = `اللاعب ${currentPlayer} فاز! المسيح قام!`;
                            winnerText.style.display = 'block';
                        } else {
                            switchPlayer();
                        }
                    }, 800);
                } else {
                    playerPositions[currentPlayer - 1] = newPosition;
                }
                
                updatePlayerPosition(currentPlayer, newPosition);
                
                if (newPosition < 100 && !snakesAndLadders[newPosition]) {
                    setTimeout(() => {
                        switchPlayer();
                    }, 800);
                }
            }
            
            // Switch to the next player
            function switchPlayer() {
                setCurrentPlayer(currentPlayer === 1 ? 2 : 1);
            }
            
            // Restart the game
            function restartGame() {
                playerPositions = [1, 1];
                currentPlayer = 1;
                gameActive = true;
                winnerText.style.display = 'none';
                initializePlayers();
                setCurrentPlayer(1);
            }
            
            // Event listeners
            dice.addEventListener('click', rollDice);
            
            // Initialize the game
            initializeBoard();
        });
