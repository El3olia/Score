<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>لعبة السلم والثعبان - قيامة المسيح</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #2c3e50;
        }
        
        h1 {
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            gap: 20px;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            align-items: center;
        }
        
        .players-info {
            display: flex;
            gap: 20px;
        }
        
        .game-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }
        
        .game-container {
            position: relative;
            width: 500px;
            height: 500px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 2px;
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .cell {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .cell-number {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 10px;
            color: #6c757d;
        }
        
        .player {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            position: absolute;
            transition: all 0.5s ease;
            z-index: 10;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        

        .player1 {
  width: 30px;
  height: 30px;
  background-size: cover;
  background-repeat: no-repeat;

}

        
.player2 {
  width: 30px;
  height: 30px;
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%233498db' viewBox='0 0 24 24'><path d='M5,22H2V18a1,1,0,0,1,1-1H4a1,1,0,0,1,1,1Zm16-5H20a1,1,0,0,0-1,1v4h3V18A1,1,0,0,0,21,17ZM4,13H6v9h4.5V18.5a1.5,1.5,0,0,1,3,0V22H18V13h2L13,8V6h2V5h0V4H13V2H11V4H9V6h2V8Z'/></svg>");

        .connector {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            background-repeat: no-repeat;
            background-size: contain;
        }
        
        .ladder {
            width: 40px !important;
  height: 40px !important;

            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M15,10 L25,10 L25,90 L15,90 Z M35,10 L45,10 L45,90 L35,90 Z M20,20 L40,20 M20,40 L40,40 M20,60 L40,60 M20,80 L40,80" stroke="%23a67c52" stroke-width="3" fill="none"/></svg>');
        }
        
        .snake {
            width: 40px !important;
  height: 40px !important;

    background-image: url('images/snake.png');
    background-size: cover; /* Optional: ensures the image covers the element */
    background-repeat: no-repeat; /* Optional: prevents tiling */
    background-position: center; /* Optional: centers the image */
}        
        .connector-label {
            position: absolute;
            font-size: 10px;
            background-color: rgba(255,255,255,0.9);
            padding: 2px 4px;
            border-radius: 3px;
            z-index: 6;
            font-weight: bold;
            pointer-events: none;
        }
        
        .ladder-label {
            color: #a67c52;
        }
        
        .snake-label {
            color: #2ecc71;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            border-radius: 5px;
            background-color: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            min-width: 120px;
        }
        
        .player-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        
        .player1-icon {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%23e74c3c' viewBox='0 0 24 24'><path d='M5,22H2V18a1,1,0,0,1,1-1H4a1,1,0,0,1,1,1Zm16-5H20a1,1,0,0,0-1,1v4h3V18A1,1,0,0,0,21,17ZM4,13H6v9h4.5V18.5a1.5,1.5,0,0,1,3,0V22H18V13h2L13,8V6h2V5h0V4H13V2H11V4H9V6h2V8Z'/></svg>");
        }
        
        .player2-icon {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%233498db' viewBox='0 0 24 24'><path d='M5,22H2V18a1,1,0,0,1,1-1H4a1,1,0,0,1,1,1Zm16-5H20a1,1,0,0,0-1,1v4h3V18A1,1,0,0,0,21,17ZM4,13H6v9h4.5V18.5a1.5,1.5,0,0,1,3,0V22H18V13h2L13,8V6h2V5h0V4H13V2H11V4H9V6h2V8Z'/></svg>");
        }
        
        .current-player {
            border: 2px solid #f39c12;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 200px;
        }
        
        .dice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .dice {
            width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
    border-radius: 10px;
    display: flex
;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    cursor: pointer;
    transition: transform 0.3s ease;
    color: white;
        }
        
        .dice:hover {
            transform: scale(1.05);
        }
        
        .dice.rolling {
            animation: roll 0.5s ease-out;
        }
        
        @keyframes roll {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        .dice-label {
            font-weight: bold;
            color: #2c3e50;
        }
        
       
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);
            animation: modalFadeIn 0.3s ease;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            color: #2c3e50;
            line-height: 1.5;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .option {
            padding: 10px 15px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .option:hover {
            background-color: #e9ecef;
        }
        
        .correct {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }
        
        .wrong {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }
        
        .result {
            font-weight: bold;
            margin-top: 15px;
            font-size: 18px;
        }
        
        .winner {
            color: #f39c12;
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        
        /* Animation for player movement */
        @keyframes moveUp {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        
        .move-up {
            animation: moveUp 0.5s ease;
        }
        
        @media (max-width: 768px) {
            .game-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .game-area {
                flex-direction: column;
                align-items: center;
            }
            
            .game-container {
                width: 350px;
                height: 350px;
            }
            
            .controls {
                width: 350px;
                flex-direction: row;
                justify-content: center;
            }
        }
    </style>
</head>

                        const cellNumber = (row % 2 === 0) ? (row * 10 + col + 1) : (row * 10 + (10 - col));
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.number = cellNumber;

                        cellNumberSpan.className = 'cell-number';
                        cellNumberSpan.textContent = cellNumber;
                        cell.appendChild(cellNumberSpan);

            // Add snakes and ladders to the board with labels
            function addSnakesAndLadders() {
                Object.keys(snakesAndLadders).forEach(start => {
                    const {end, label} = snakesAndLadders[start];
                    const startCell = document.querySelector(`.cell[data-number="${start}"]`);
                    const endCell = document.querySelector(`.cell[data-number="${end}"]`);
                    
                    if (!startCell || !endCell) return;
                    
                    const startRect = startCell.getBoundingClientRect();
                    const endRect = endCell.getBoundingClientRect();
                    const boardRect = board.getBoundingClientRect();
                    
                    const startX = startRect.left + startRect.width / 2 - boardRect.left;
                    const startY = startRect.top + startRect.height / 2 - boardRect.top;
                    const endX = endRect.left + endRect.width / 2 - boardRect.left;
                    const endY = endRect.top + endRect.height / 2 - boardRect.top;
                    
                    // Create connector (ladder or snake)
                    const connector = document.createElement('div');
                    connector.className = start < end ? 'ladder connector' : 'snake connector';
                    
                    // Calculate connector dimensions and position
                    const width = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
                    const height = start < end ? 20 : 15;
                    const angle = Math.atan2(endY - startY, endX - startX);
                    
                    connector.style.width = `${width}px`;
                    connector.style.height = `${height}px`;
                    connector.style.left = `${startX}px`;
                    connector.style.top = `${startY - height/2}px`;
                    connector.style.transformOrigin = '0 50%';
                    connector.style.transform = `rotate(${angle}rad)`;
                    
                    board.appendChild(connector);
                    
                    // Add label at the middle of the connector
                    const labelElement = document.createElement('div');
                    labelElement.className = start < end ? 'ladder-label connector-label' : 'snake-label connector-label';

                    board.appendChild(labelElement);

                    resultText.textContent = 'إجابة صحيحة! يمكنك الاستمرار.';
                    setTimeout(() => {
                        questionModal.style.display = 'none';
                        movePlayer(diceValue);
                    }, 1500);
                } else {
                    resultText.textContent = 'إجابة خاطئة! سيتم تخطي دورك.';
                    setTimeout(() => {
                        questionModal.style.display = 'none';
                        switchPlayer();
                    }, 1500);
                }
            }
            
            // Move the player
            function movePlayer(steps) {
                let newPosition = playerPositions[currentPlayer - 1] + steps;
                
                // Check if player won
                if (newPosition >= 100) {
                    newPosition = 100;
                    gameActive = false;
                    winnerText.textContent = `اللاعب ${currentPlayer} فاز! المسيح قام!`;
                    winnerText.style.display = 'block';
                }
                
                // Check for snake or ladder
                if (snakesAndLadders[newPosition]) {
                    const destination = snakesAndLadders[newPosition].end;
                    const isLadder = destination > newPosition;
                    
                    setTimeout(() => {
                        newPosition = destination;
                        playerPositions[currentPlayer - 1] = newPosition;
                        updatePlayerPosition(currentPlayer, newPosition);
                        
                        if (newPosition === 100) {
                            gameActive = false;
                            winnerText.textContent = `اللاعب ${currentPlayer} فاز! المسيح قام!`;
                            winnerText.style.display = 'block';
                        } else {
                            switchPlayer();
                        }
                    }, 800);
                } else {
                    playerPositions[currentPlayer - 1] = newPosition;
                }
                
                updatePlayerPosition(currentPlayer, newPosition);
                
                if (newPosition < 100 && !snakesAndLadders[newPosition]) {
                    setTimeout(() => {
                        switchPlayer();
                    }, 800);
                }
            }
            
            // Switch to the next player
            function switchPlayer() {
                setCurrentPlayer(currentPlayer === 1 ? 2 : 1);
            }
            
            // Restart the game
            function restartGame() {
                playerPositions = [1, 1];
                currentPlayer = 1;
                gameActive = true;
                winnerText.style.display = 'none';
                initializePlayers();
                setCurrentPlayer(1);
            }
            
            // Event listeners
            dice.addEventListener('click', rollDice);
            
            // Initialize the game
            initializeBoard();
        });
    </script>
</body>
</html>
